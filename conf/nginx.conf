# Ditto is a static Vite SPA (no backend, no systemd service). Keep missing
# hashed assets as 404s while routing application navigations back to
# index.html, and let the browser cache hashed assets aggressively since
# their filename changes whenever their content does.
location __PATH__/assets/ {
    alias __INSTALL_DIR__/dist/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The web app manifest (PWA "add to homescreen" metadata) needs its own MIME
# type - nginx's default mime.types has no entry for .webmanifest, so it
# would otherwise be served as application/octet-stream and some browsers
# refuse to use it.
location = __PATH__/manifest.webmanifest {
    alias __INSTALL_DIR__/dist/manifest.webmanifest;
    default_type application/manifest+json;
}

location __PATH__/ {
    alias __INSTALL_DIR__/dist/;
    index index.html;
    try_files $uri $uri/ __PATH__/index.html;
}

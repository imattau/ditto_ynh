packaging_format = 2

id = "ditto"
name = "Ditto"
description.en = "A fun, customizable Nostr client that puts you in control"
description.fr = "Un client Nostr amusant et personnalisable qui vous laisse le contrôle"
version = "2.37.1~ynh1"
maintainers = ["ditto_ynh contributors"]

[upstream]
license = "AGPL-3.0-only"
website = "https://ditto.pub"
code = "https://gitlab.com/soapbox-pub/ditto"

[integration]
yunohost = ">= 11.1.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "400M"
ram.build = "1G"
ram.runtime = "1M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/ditto"

    [install.init_main_permission]
    type = "group"
    default = "visitors"
    help = "Who should be allowed to access Ditto?"

[resources]

    [resources.sources.main]
    url = "https://gitlab.com/soapbox-pub/ditto/-/archive/v2.37.1/ditto-v2.37.1.tar.gz"
    sha256 = "0e4de0a34be274f0c0e494e766b8127409abcdad86c06d5faf4365b82a61c57d"
    autoupdate.strategy = "latest_gitlab_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.nodejs]
    version = "22"

    [resources.permissions]
    main.url = "/"
